<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Heart Pick - 커플 미니멀 게임</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Screen 1: Home -->
    <section id="screen-home" class="screen active">
      <header class="home-header">
        <div class="heart-brand-icon">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h1 class="brand-title">Heart Pick</h1>
        <p class="brand-subtitle">둘만의 가벼운 내기를 위한 미니멀 커플 게임</p>
      </header>

      <main class="home-main">
        <!-- 1. Prominent Player Name Setup (Top Priority Induction) -->
        <div class="player-setup-card" id="btn-open-player-modal" role="button" tabindex="0">
          <div class="player-setup-header">
            <span class="player-setup-tag">플레이어 설정</span>
            <span class="player-setup-action">
              변경
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </span>
          </div>
          <div class="player-names-display">
            <div class="player-pill p1-pill">
              <span class="pill-dot"></span>
              <span class="pill-name" id="preview-p1">Player 1</span>
            </div>
            <span class="vs-text">VS</span>
            <div class="player-pill p2-pill">
              <span class="pill-dot"></span>
              <span class="pill-name" id="preview-p2">Player 2</span>
            </div>
          </div>
          <p class="player-setup-hint">터치해서 둘만의 애칭이나 이름을 먼저 설정해보세요</p>
        </div>

        <!-- 2. Game Selection (Square Cards with 3D Icons) -->
        <div class="game-select-section">
          <div class="section-title">게임 선택</div>
          <div class="game-square-grid">
            <!-- Game 1: Heart Game -->
            <button type="button" class="game-square-card" id="btn-select-heart-game">
              <div class="game-icon-3d heart-3d-wrapper">
                <div class="icon-3d-card">
                  <svg viewBox="0 0 48 48" width="46" height="46" fill="none">
                    <defs>
                      <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF6B75"/>
                        <stop offset="100%" stop-color="#E53945"/>
                      </linearGradient>
                      <filter id="heartShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#FF4B55" flood-opacity="0.35"/>
                      </filter>
                    </defs>
                    <rect x="4" y="4" width="40" height="40" rx="14" fill="#FFFFFF" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
                    <path d="M24 37.7l-2.18-1.98C14.1 28.74 9 24.12 9 18.45 9 13.83 12.63 10.2 17.25 10.2c2.61 0 5.12 1.22 6.75 3.14 1.63-1.92 4.14-3.14 6.75-3.14 4.62 0 8.25 3.63 8.25 8.25 0 5.67-5.1 10.29-12.82 17.27L24 37.7z" fill="url(#heartGrad)" filter="url(#heartShadow)"/>
                  </svg>
                </div>
              </div>
              <div class="game-card-info">
                <span class="game-card-title">하트 게임</span>
                <span class="game-card-sub">숨겨진 하트 찾기</span>
              </div>
              <span class="game-card-badge">옵션 선택</span>
            </button>

            <!-- Game 2: Roulette Game -->
            <button type="button" class="game-square-card" id="btn-select-roulette-game">
              <div class="game-icon-3d roulette-3d-wrapper">
                <div class="icon-3d-card">
                  <svg viewBox="0 0 48 48" width="46" height="46" fill="none">
                    <defs>
                      <linearGradient id="rouletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#4F4A45"/>
                        <stop offset="100%" stop-color="#2D2A26"/>
                      </linearGradient>
                    </defs>
                    <rect x="4" y="4" width="40" height="40" rx="14" fill="#FFFFFF" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.06))"/>
                    <circle cx="24" cy="24" r="14" fill="#F4EFE6" stroke="#D8D2C9" stroke-width="2"/>
                    <path d="M24 10 A14 14 0 0 1 38 24 L24 24 Z" fill="#E8DEC8"/>
                    <path d="M38 24 A14 14 0 0 1 24 38 L24 24 Z" fill="#D5CBB9"/>
                    <path d="M24 38 A14 14 0 0 1 10 24 L24 24 Z" fill="#E8DEC8"/>
                    <path d="M10 24 A14 14 0 0 1 24 10 L24 24 Z" fill="#D5CBB9"/>
                    <circle cx="24" cy="24" r="4.5" fill="url(#rouletteGrad)"/>
                    <polygon points="24,7 21,13 27,13" fill="#FF4B55" filter="drop-shadow(0 2px 3px rgba(255,75,85,0.4))"/>
                  </svg>
                </div>
              </div>
              <div class="game-card-info">
                <span class="game-card-title">룰렛 게임</span>
                <span class="game-card-sub">즉석 확률 결정</span>
              </div>
              <span class="game-card-badge">즉시 시작</span>
            </button>
          </div>
        </div>
      </main>

      <footer class="home-footer">
        <span>데이트 내기 & 순서 정하기</span>
      </footer>
    </section>

    <!-- Screen 2: Play Screen -->
    <section id="screen-play" class="screen">
      <!-- Minimal Top Navigation (GNB) -->
      <header class="play-header">
        <button id="btn-back-home" class="btn-icon" aria-label="홈으로 가기">
          <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <span class="game-top-title" id="game-top-title">하트 게임 (5x5)</span>

        <button id="btn-reset" class="btn-icon" aria-label="다시 섞기">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
        </button>
      </header>

      <!-- Prominent Standalone Turn Section (Above Cards) -->
      <section class="turn-section" id="turn-section">
        <div class="turn-card-banner" id="turn-card-banner">
          <span class="turn-chip" id="turn-chip">P1</span>
          <div class="turn-info">
            <span class="turn-sub-guide">현재 차례</span>
            <span class="turn-main-name" id="turn-main-name">Player 1</span>
          </div>
          <div class="turn-pulse-dot"></div>
        </div>
      </section>

      <!-- Game Stage (Card Grid or Roulette) -->
      <main class="play-stage">
        <!-- Card Game Grid View -->
        <div id="card-view" class="game-view">
          <div class="card-grid" id="card-grid"></div>
        </div>

        <!-- Roulette View -->
        <div id="roulette-view" class="game-view" style="display: none;">
          <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <canvas id="roulette-canvas" width="300" height="300"></canvas>
            <div class="roulette-center-pin"></div>
          </div>
          <div class="roulette-inputs-section">
            <div class="roulette-inputs-title">선택지 (쉼표로 구분)</div>
            <input type="text" id="roulette-items-input" class="roulette-input" value="Player 1, Player 2" placeholder="항목1, 항목2, 항목3">
          </div>
          <button id="btn-spin-roulette" class="btn-primary" type="button">룰렛 돌리기</button>
        </div>
      </main>
    </section>

    <!-- Modal 1: Heart Game Option Modal (4x4 vs 5x5) -->
    <div id="heart-option-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-option-icon">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="#FF4B55">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h2 class="modal-title">하트 게임 옵션</h2>
        <p class="modal-desc">카드 개수를 선택해 주세요.</p>

        <div class="option-button-group">
          <button type="button" class="btn-grid-option" id="btn-opt-5x5">
            <div class="opt-left">
              <span class="opt-name">5x5 카드 모드</span>
              <span class="opt-desc">25장 중 하트 1개 · 기본 모드</span>
            </div>
            <span class="opt-badge">추천</span>
          </button>

          <button type="button" class="btn-grid-option" id="btn-opt-4x4">
            <div class="opt-left">
              <span class="opt-name">4x4 카드 모드</span>
              <span class="opt-desc">16장 중 하트 1개 · 빠른 승부</span>
            </div>
            <span class="opt-badge">스피디</span>
          </button>
        </div>

        <button id="btn-cancel-heart-option" class="btn-secondary" type="button" style="width:100%; margin-top: 12px;">닫기</button>
      </div>
    </div>

    <!-- Modal 2: Player Name Settings Modal -->
    <div id="player-modal" class="modal-backdrop">
      <div class="modal-card">
        <h2 class="modal-title">플레이어 이름 설정</h2>
        <p class="modal-desc">게임에서 부를 이름을 입력해 주세요.</p>
        
        <div class="player-input-group">
          <div class="input-field">
            <label for="input-p1-name">플레이어 1 (선공)</label>
            <input type="text" id="input-p1-name" maxlength="10" placeholder="Player 1" value="Player 1">
          </div>
          <div class="input-field">
            <label for="input-p2-name">플레이어 2 (후공)</label>
            <input type="text" id="input-p2-name" maxlength="10" placeholder="Player 2" value="Player 2">
          </div>
        </div>

        <div class="modal-actions">
          <button id="btn-save-players" class="btn-primary" type="button">저장 완료</button>
          <button id="btn-cancel-players" class="btn-secondary" type="button">취소</button>
        </div>
      </div>
    </div>

    <!-- Modal 3: Result Modal Dialog -->
    <div id="result-modal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-heart-icon">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <h2 class="modal-title" id="modal-winner-title">당첨!</h2>
        <p class="modal-desc" id="modal-winner-desc">축하합니다!</p>
        <div class="modal-actions">
          <button id="btn-modal-retry" class="btn-primary" type="button">한 판 더 하기</button>
          <button id="btn-modal-home" class="btn-secondary" type="button">홈으로</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
